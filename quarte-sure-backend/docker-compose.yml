    services:
      postgres:
        container_name: postgres
        image: postgres
        environment:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          PGDATA: /var/lib/postgresql/data
          POSTGRES_DB: winner_db
        volumes:
          - db-data:/var/lib/postgres/data
        ports:
          - 5432:5432
        networks:
          - spring-winner
        restart: unless-stopped

#      mail-dev:
#        container_name: mail-dev-winner
#        image: maildev/maildev
#        ports:
#          - '1080:1080'
#          - '1025:1025'

      winner-back:
      #  build: ../docker/backend/Dockerfile .
        container_name: winner_backend_container
        image: winner-back-image:1.0.6
        environment:
          - DB_URL:jdbc:postgresql://postgresql-winner:5432/winner_db
        ports:
          - 8085:8085
        networks:
          - spring-winner
        depends_on:
          - postgres

      winner-front:
     #  build: ../../argon-dashboard-angular-master
        container_name: winner_frontend_container
        image: winner-front-image:1.0.6
        ports:
         - '8086:81'
        networks:
         - spring-winner
        depends_on:
         - winner-back
    networks:
      spring-winner:
        driver: bridge

    volumes:
      db-data: