    name: Build & Deploy Spring app

    on:
      push:
        branches:
          - with-computting
    jobs:
      build-deploy:
        name: Build and Deploy winner Spring boot
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'corretto'
              java-version: 17

#          - name: Unit Tests
#            run: mvn -B test pom.xml

          - name: Build the application
            run: mvn -B package quarte-sure-backend/pom.xml



