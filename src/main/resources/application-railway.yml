spring:
  datasource:
    url: jdbc:${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      format_sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  application:
    mailing:
      frontend:
        activation-url: ${FRONTEND_ACTIVATION_URL}#/activate-account
        registration-url: ${FRONTEND_REGISTRATION_URL}#/register

  mail:
    host: smtp.gmail.com
    port: 465
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: false
            trust: "*"
        starttls:
          enabled: true
    protocol: smtp

server:
  port: ${PORT:8080}
  ssl:
    enabled: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  mode: sandbox

app:
  profile: railway
