spring:
  datasource:
#    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
#    username: ${PGUSER}
#    password: ${PGPASSWORD}
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver



  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      format_sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  application:
    mailing:
      frontend:
        activation-url: ${FRONTEND_ACTIVATION_URL}#/activate-account
        registration-url: ${FRONTEND_REGISTRATION_URL}#/register

  mail:
    host: smtp-relay.sendinblue.com
    port: 587
    username: contact@monapp.com
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
#    host: smtp.gmail.com
#    port: 587
#    username: ${MAIL_USERNAME}
#    password: ${MAIL_PASSWORD}
#    properties:
#      mail:
#        smtp:
#          auth: true
#          starttls:
#            enable: true

server:
  port: ${PORT:8080}
  ssl:
    enabled: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

