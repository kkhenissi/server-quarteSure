spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/winner_db?sslmode=require
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  application:
    mailing:
      frontend:
        activation-url: ${FRONTEND_ACTIVATION_URL}#/activate-account
        registration-url: ${FRONTEND_REGISTRATION_URL}#/register

# 👉 CONFIG BREVO API UNIQUEMENT
brevo:
  api-key: ${BREVO_API_KEY}w
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME}

server:
  port: ${PORT:8080}
  ssl:
    enabled: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

app:
  profile: railway
