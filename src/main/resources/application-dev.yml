spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/winner_db
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  application:
    mailing:
      frontend:
        activation-url: http://localhost:4600/#/activate-account
        registration-url: http://localhost:4600/#/register
