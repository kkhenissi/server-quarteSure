spring:
#  profiles:
#    active: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/winner_db}
    username: ${DB_USERNAME:username}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  mvc:
    dispatch-options-request: true
  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      format_sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  openai:
    api:
      key: "${OPENAI_API_KEY}"
