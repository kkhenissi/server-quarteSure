  name: WINNER Frontend Pipeline

  on:
    push:
      branches:
      - main
      paths:
        - argon-dashboard-angular-master/**
    pull_request:
      branches:
      - main

  jobs:
    frontend-test:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: argon-dashboard-angular-master

      steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: launch test
        run: npm test 

    # backend-test:
    

    build-image:
      name: Build FE docker image
      runs-on: self-hosted
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          width:
            fetch-depth: 0

        - name: extract project version
          id: extract_version
          run: |
            echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

        - name: Login to DockerHub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build & Push to DockerHub
          uses: docker/build-push-action@v5
          with:
            context: .
            file: Dockerfile
            push: true

            platforms: linux/amd64
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/winner-front:${{ steps.extract_version.outputs.VERSION }},${{ secrets.DOCKERHUB_USERNAME }}/winner-front:latest

    deploy:
        name: Deploy Frontend
        runs-on: self-hosted
        needs: [build-image]
        steps:
          - name: Create deployment folder
            run: ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_VPS_IP }} "mkdir -p janvier-branch"

          - name: Copy docker-compose file
            run: scp docker_compose.yml ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:janvier-branch/docker-compose.yml

          - name: Set ENV variable & deploy
            run: |
              ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOF
              cd janvier-branch
              docker-compose -f docker-compose.yml pull -q
              docker-compose -f docker-compose up -d
              EOF
